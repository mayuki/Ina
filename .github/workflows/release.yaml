name: Release

# Publishes the ina tool (package Ina) and Ina.Sdk to nuget.org and creates a GitHub release, when the tag of a
# version is pushed. Both packages carry the version in Directory.Build.props, which the tag has to name: v0.1.0
# releases 0.1.0. nuget.org accepts the packages through Trusted Publishing, so the repository holds no API key;
# "Releasing" in README.md lists what has to be set up on nuget.org and in the repository for that.
#
# The jobs are split by the permissions they need: only the push to nuget.org may request an OIDC token, and only
# the creation of the release may write to the repository. A failed push or release can be run again on its own.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Nothing is published from a commit that does not pass what every change has to pass.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Runs alongside the CI jobs, so that a tag that names the wrong version fails within minutes.
      - name: Check the tag against the version of the packages
        id: version
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          for project in src/Ina src/Ina.Sdk; do
            actual=$(dotnet msbuild "$project" -getProperty:Version)
            if [ "$actual" != "$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version of $project ($actual), see Directory.Build.props"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack
        run: |
          set -euo pipefail
          for project in src/Ina src/Ina.Sdk; do
            dotnet pack "$project" -c Release -o artifacts -p:ContinuousIntegrationBuild=true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: [ci, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Trusted Publishing policy on nuget.org names this environment, and protection rules can be added to it.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Ina.Sdk/${{ needs.pack.outputs.version }}
    permissions:
      id-token: write # the OIDC token that nuget.org exchanges for an API key valid for one hour
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      # --skip-duplicate lets a run that failed after the first package try again.
      - name: Push the packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Create the GitHub release
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      # The notes start with links to the packages; GitHub appends the changes since the previous release.
      # A version with a pre-release label, such as 0.2.0-preview.1, becomes a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          notes="Packages on nuget.org:

          - [Ina $VERSION](https://www.nuget.org/packages/Ina/$VERSION): the \`ina\` command as a .NET tool
          - [Ina.Sdk $VERSION](https://www.nuget.org/packages/Ina.Sdk/$VERSION): \`dotnet publish\` with \`PublishIna\`"
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes "${prerelease[@]}"
