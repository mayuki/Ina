name: Release

# Stages the ina tool (package Ina) and Ina.Sdk on nuget.org and drafts a GitHub release, when the tag of a version
# is pushed. Both packages carry the version in Directory.Build.props, which the tag has to name: v0.1.0 releases
# 0.1.0. The packages are uploaded through Trusted Publishing, so the repository holds no API key, and with staged
# publishing: nuget.org validates them but keeps them private until a maintainer promotes them on the website. The
# release is complete when the draft is published after that. docs/Releasing.md describes these steps and
# what has to be set up on nuget.org and in the repository.
#
# The jobs are split by the permissions they need: only the upload to nuget.org may request an OIDC token, and only
# the creation of the release may write to the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The tests are not run again: the tagged commit is expected to have passed CI on its way to main.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Comes first, so that a tag that names the wrong version fails before anything is built.
      - name: Check the tag against the version of the packages
        id: version
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          for project in src/Ina src/Ina.Sdk; do
            actual=$(dotnet msbuild "$project" -getProperty:Version)
            if [ "$actual" != "$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version of $project ($actual), see Directory.Build.props"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The README goes into the packages and shows how a project refers to Ina.Sdk, with a version. Setting the
      # version again must change nothing; the tests check the same, but they are not run here.
      - name: Check the version in the documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet run eng/SetVersion.cs -- "$VERSION"
          if ! git diff --exit-code; then
            echo "::error::The documentation does not name the version $VERSION, run eng/SetVersion.cs before tagging"
            exit 1
          fi
      - name: Pack
        run: |
          set -euo pipefail
          for project in src/Ina src/Ina.Sdk; do
            dotnet pack "$project" -c Release -o artifacts -p:ContinuousIntegrationBuild=true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  stage:
    name: Stage on nuget.org
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Trusted Publishing policy on nuget.org names this environment, and protection rules can be added to it.
    # The link leads to the packages of the account, where the staged ones are promoted.
    environment:
      name: nuget
      url: https://www.nuget.org/account/Packages
    permissions:
      contents: read # global.json, which selects an SDK that can stage packages (.NET 11 and later)
      id-token: write # the OIDC token that nuget.org exchanges for an API key valid for one hour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      # Both packages go into one staging group, so that "Promote group" releases them together. The command takes
      # one package at a time and reads the API key from NUGET_API_KEY.
      - name: Stage the packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/*.nupkg; do
            dotnet package stage push "$package" --source https://api.nuget.org/v3/index.json --group ina
          done

  release:
    name: Draft the GitHub release
    needs: [pack, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      # A draft, because the packages that the notes link to are not public before they are promoted on nuget.org.
      # The notes start with links to the packages; GitHub appends the changes since the previous release.
      # A version with a pre-release label, such as 0.2.0-preview.1, becomes a pre-release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          notes="Packages on nuget.org:

          - [Ina $VERSION](https://www.nuget.org/packages/Ina/$VERSION): the \`ina\` command as a .NET tool
          - [Ina.Sdk $VERSION](https://www.nuget.org/packages/Ina.Sdk/$VERSION): \`dotnet publish\` with \`PublishIna\`"
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes "${prerelease[@]}"
